version: 2
updates:
    # Grouped and monthly, so updates arrive as one pull request to review rather than a stream
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: monthly
      open-pull-requests-limit: 2
      groups:
          dependencies:
              patterns:
                  - "*"
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      groups:
          actions:
              patterns:
                  - "*"
