name: Test Patches
on:
    workflow_dispatch:
        inputs:
            discord_branch:
                type: choice
                description: "Discord Branch to test patches on"
                options:
                    - both
                    - stable
                    - canary
                default: both
            webhook_url:
                type: string
                description: "Webhook URL that the report will be posted to. This is visible to everyone, so do not pass a sensitive webhook."
                required: false
    # Discord ships updates daily; this catches plugins they break before users notice.
    schedule:
        - cron: 0 6 * * *

jobs:
    TestPlugins:
        if: github.repository == 'rootpoii/Endcord'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write

        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6 # Install pnpm using packageManager key in package.json

            - name: Use Node.js 24
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "pnpm"

            - name: Install dependencies
              run: |
                  pnpm install --frozen-lockfile

            - name: Build Endcord Reporter Version
              run: pnpm buildReporter

            - name: Run Reporter
              id: reporter
              timeout-minutes: 10
              continue-on-error: true
              run: |
                  export PATH="$PWD/node_modules/.bin:$PATH"
                  export CHROMIUM_BIN=/usr/bin/google-chrome

                  esbuild scripts/generateReport.ts > dist/report.mjs

                  stable_output_file=$(mktemp)
                  canary_output_file=$(mktemp)

                  pids=""

                  branch="${{ inputs.discord_branch }}"
                  if [[ "${{ github.event_name }}" = "schedule" ]]; then
                    branch="both"
                  fi

                  if [[ "$branch" = "both" || "$branch" = "stable" ]]; then
                    node dist/report.mjs > "$stable_output_file" &
                    pids+=" $!"
                  fi

                  if [[ "$branch" = "both" || "$branch" = "canary" ]]; then
                    USE_CANARY=true node dist/report.mjs > "$canary_output_file" &
                    pids+=" $!"
                  fi

                  exit_code=0
                  for pid in $pids; do
                      if ! wait "$pid"; then
                        exit_code=1
                      fi
                  done

                  cat "$stable_output_file" "$canary_output_file" > report.md
                  cat report.md >> $GITHUB_STEP_SUMMARY
                  exit $exit_code
              env:
                  WEBHOOK_URL: ${{ inputs.webhook_url || secrets.DISCORD_WEBHOOK }}
                  WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}

            # Keeps one open issue while something is broken, so GitHub notifies the maintainers,
            # and closes it once a run comes back clean.
            - name: Report broken plugins in an issue
              if: always() && github.event_name == 'schedule' && hashFiles('report.md') != ''
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  BROKEN: ${{ steps.reporter.outcome == 'failure' }}
                  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  title="Plugins broken by a Discord update"
                  issue=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')

                  if [[ "$BROKEN" == "true" ]]; then
                    { echo "The daily patch test found plugins that Discord broke. Full log: $RUN_URL"; echo; head -c 60000 report.md; } > body.md
                    if [[ -n "$issue" ]]; then
                      gh issue comment "$issue" --body-file body.md
                    else
                      gh issue create --title "$title" --body-file body.md
                    fi
                  elif [[ -n "$issue" ]]; then
                    gh issue close "$issue" --comment "Everything passes again as of $RUN_URL"
                  fi
