name: Mutation test
# Switches each security check off to prove the tests would notice. Too slow for every push.
on:
    schedule:
        - cron: "0 4 * * 1"
    workflow_dispatch:
permissions:
    contents: read
jobs:
    mutation:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6, installs pnpm using packageManager
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - run: pnpm testMutation
