name: Mutation test
# Switches each security check off to prove the tests would notice. Too slow for every push.
on:
    schedule:
        - cron: "0 4 * * 1"
    workflow_dispatch:
permissions:
    contents: read
jobs:
    mutation:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
            - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6, installs pnpm using packageManager
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: 24
                  cache: "pnpm"
            - run: pnpm install --frozen-lockfile
            - run: pnpm testMutation
